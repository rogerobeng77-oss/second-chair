[pytest]
testpaths = tests
addopts = -q
# Our own deprecations are errors (friction log item 6: pytest swallows them by default
# and a deprecated call then looks fine until an upgrade removes it). Third-party noise
# from the test client is not our problem and is silenced by name, not by switching the
# warnings plugin off.
filterwarnings =
    error::DeprecationWarning:second_chair.*
    ignore::DeprecationWarning:starlette.testclient
    ignore::DeprecationWarning:anyio.*
    ignore:Using `httpx` with `starlette.testclient` is deprecated
